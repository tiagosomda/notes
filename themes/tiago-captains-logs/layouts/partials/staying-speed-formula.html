<div class="staying-speed-system {{ .class }}">
  {{ if .heading }}
    <h1 class="staying-speed-equation" aria-label="The Staying Speed equals The Right Effort plus Time">
      <span class="equation-speed" aria-hidden="true"><var>v</var><sub>s</sub></span>
      <i aria-hidden="true">=</i>
      <span aria-hidden="true"><var>E</var><sub>r</sub></span>
      <i aria-hidden="true">+</i>
      <span aria-hidden="true"><var>t</var></span>
    </h1>
  {{ else }}
    <div class="staying-speed-equation" aria-label="The Staying Speed equals The Right Effort plus Time">
      <span class="equation-speed" aria-hidden="true"><var>v</var><sub>s</sub></span>
      <i aria-hidden="true">=</i>
      <span aria-hidden="true"><var>E</var><sub>r</sub></span>
      <i aria-hidden="true">+</i>
      <span aria-hidden="true"><var>t</var></span>
    </div>
  {{ end }}
  <div class="staying-speed-key" aria-hidden="true">
    <span><b>v<sub>s</sub></b> The Staying Speed</span>
    <span><b>E<sub>r</sub></b> The Right Effort</span>
    <span><b>t</b> Time</span>
  </div>
  <div class="staying-speed-band-disclosure" data-staying-speed-disclosure>
    <button type="button" aria-expanded="false" aria-controls="staying-speed-band-details" data-staying-speed-toggle>
      <span>Adaptive band model</span>
      <i aria-hidden="true">+</i>
    </button>
    <div class="staying-speed-band-reveal" id="staying-speed-band-details" aria-hidden="true">
      <div class="staying-speed-band-reveal-inner">
        <div class="staying-speed-band-equation" aria-label="The right effort at time t stays within the adaptive band at time t. The band's fluctuation depends on events, environment, and emotions.">
          <span aria-hidden="true"><var>E</var><sub>r</sub>(<var>t</var>) <i>∈</i> <var>B</var>(<var>t</var>)</span>
          <span aria-hidden="true"><var>ΔB</var>(<var>t</var>) <i>=</i> <var>f</var>(events, environment, emotions)</span>
        </div>
        <div class="staying-speed-key staying-speed-band-key" aria-hidden="true">
          <span><b>B(t)</b> Adaptive Band</span>
          <span><b>ΔB(t)</b> Band Fluctuation</span>
        </div>
      </div>
    </div>
  </div>
</div>
